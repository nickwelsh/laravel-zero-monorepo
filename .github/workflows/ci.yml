name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_zero_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZERO_TEST_PG_DATABASE: laravel_zero_test
      ZERO_TEST_PG_USER: postgres
      ZERO_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, mbstring
          coverage: ${{ matrix.php == '8.3' && matrix.laravel == '^13.0' && 'xdebug' || 'none' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: composer --working-dir=packages/laravel validate --strict
      - run: composer --working-dir=packages/laravel update --with 'laravel/framework:${{ matrix.laravel }}' --with 'orchestra/testbench:${{ matrix.testbench }}' --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @laravel-zero/docs deploy:check
      - run: pnpm test:coverage
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
      - run: pnpm php:test:coverage
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        env:
          XDEBUG_MODE: coverage
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        with:
          name: coverage
          path: |
            coverage/client
            packages/laravel/coverage
