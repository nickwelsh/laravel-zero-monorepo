name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "^13.0"
            testbench: "^11.0"
          - php: "8.5"
            laravel: "^13.0"
            testbench: "^11.0"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_zero_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZERO_TEST_PG_DATABASE: laravel_zero_test
      ZERO_TEST_PG_USER: postgres
      ZERO_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, mbstring
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: composer --working-dir=packages/laravel validate --strict
      - run: composer --working-dir=packages/laravel update --with 'laravel/framework:${{ matrix.laravel }}' --with 'orchestra/testbench:${{ matrix.testbench }}' --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: composer --working-dir=packages/laravel format:check
      - run: pnpm format:check
      - run: composer --working-dir=packages/laravel test
      - run: pnpm contracts:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm package:check
