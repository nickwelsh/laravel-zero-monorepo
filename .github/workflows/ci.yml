name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  example-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: composer --working-dir=examples/todos install --no-dev --no-interaction --prefer-dist
      - run: php examples/todos/artisan wayfinder:generate --with-form
      - uses: actions/upload-artifact@v7
        with:
          name: example-imports
          path: |
            examples/todos/resources/js/actions
            examples/todos/resources/js/routes
            examples/todos/resources/js/wayfinder

  verify:
    needs: example-imports
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_zero_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZERO_TEST_PG_DATABASE: laravel_zero_test
      ZERO_TEST_PG_USER: postgres
      ZERO_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install spelling checker
        run: sudo apt-get update && sudo apt-get install --yes aspell aspell-en
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, mbstring
          coverage: ${{ matrix.php == '8.3' && matrix.laravel == '^13.0' && 'xdebug' || 'none' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: composer --working-dir=packages/laravel validate --strict
      - run: composer --working-dir=packages/laravel update --with 'laravel/framework:${{ matrix.laravel }}' --with 'orchestra/testbench:${{ matrix.testbench }}' --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: example-imports
          path: examples/todos/resources/js
      - run: pnpm --filter @nickwelsh/laravel-zero build
      - run: pnpm check
      - run: pnpm --filter @laravel-zero/docs deploy:check
      - run: pnpm test:coverage
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
      - run: pnpm php:test:coverage
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        env:
          XDEBUG_MODE: coverage
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        with:
          name: coverage
          path: |
            coverage/client
            packages/laravel/coverage
