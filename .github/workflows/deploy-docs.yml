name: Deploy docs

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  await-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Wait for npm approval
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          const version = process.env.RELEASE_TAG.slice(1);
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch('https://registry.npmjs.org/@nickwelsh%2flaravel-zero/latest', {
                signal: AbortSignal.timeout(15_000),
              });
              if (!response.ok) throw new Error(`npm returned ${response.status}`);
              const published = await response.json();
              if (published.version === version) process.exit(0);
              console.log(`Waiting for ${version} to be approved as latest (currently ${published.version}).`);
            } catch (error) {
              console.log(`Cannot confirm npm publication: ${error.message}`);
            }
            await setTimeout(60_000);
          }
          throw new Error('Approve the staged npm version, then rerun failed jobs to deploy docs.');
          JS

  deploy:
    needs: await-publication
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://docs.nickwelsh.me/laravel-zero/
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter @laravel-zero/docs deploy:check
      - name: Confirm docs still match the current npm release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/client/package.json', 'utf8'));
          const response = await fetch('https://registry.npmjs.org/@nickwelsh%2flaravel-zero/latest', {
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok) throw new Error(`npm returned ${response.status}`);
          const published = await response.json();
          if (version.includes('-') || process.env.RELEASE_TAG !== `v${version}` || published.version !== version) {
            throw new Error('Refusing to replace production docs with a version other than the current stable npm release.');
          }
          JS
      - run: pnpm --filter @laravel-zero/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
