name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.20.0
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/client/package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}.`);
          }
          const prerelease = version.includes('-');
          if (prerelease !== (process.env.PRERELEASE === 'true')) {
            throw new Error('GitHub prerelease status must match the package version.');
          }
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${prerelease ? 'next' : 'latest'}\n`);
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @laravel-zero/client build
      - run: pnpm package:check
      - run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
        working-directory: packages/client
