name: Sync PHP mirror

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      PHP_MIRROR_SSH_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: sync-php-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      inputs.ref != '' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer --working-dir=packages/laravel validate --strict --no-check-lock
      - name: Configure mirror authentication
        env:
          PHP_MIRROR_SSH_KEY: ${{ secrets.PHP_MIRROR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PHP_MIRROR_SSH_KEY"
          install -d -m 700 "$RUNNER_TEMP/php-mirror-ssh"
          printf '%s\n' "$PHP_MIRROR_SSH_KEY" > "$RUNNER_TEMP/php-mirror-ssh/key"
          chmod 600 "$RUNNER_TEMP/php-mirror-ssh/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/php-mirror-ssh/known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/php-mirror-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/php-mirror-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Split the PHP package and push its branch or release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            git fetch --no-tags origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
            destination=refs/heads/main
          else
            git check-ref-format "refs/tags/$RELEASE_TAG"
            destination="refs/tags/$RELEASE_TAG"
          fi
          split=$(git subtree split --prefix=packages/laravel HEAD)
          git push git@github.com:nickwelsh/laravel-zero.git "$split:$destination"
      - name: Remove mirror credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/php-mirror-ssh"
