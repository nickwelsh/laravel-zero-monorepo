packages:
  - packages/*
  - examples/*
minimumReleaseAgeExclude:
  - '@rocicorp/zero@1.10.0'
allowBuilds:
  esbuild: true
  '@rocicorp/zero-sqlite3': true
  protobufjs: false
# Vite+ wraps Vite with its own version while providing the Vite API Vitest expects.
peerDependencyRules:
  allowedVersions:
    '@vitest/mocker>vite': '0.3.3'
    'vitest>vite': '0.3.3'
    '@rolldown/plugin-babel>vite': '0.3.3'
    '@vitejs/plugin-react>vite': '0.3.3'
    'laravel-vite-plugin>vite': '0.3.3'
    '@inertiajs/vite>vite': '0.3.3'
    '@tailwindcss/vite>vite': '0.3.3'
publicHoistPattern:
  - '@inertiajs/core'
